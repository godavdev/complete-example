name: complete-example-composed
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.composed
      args:
        - DATABASE_URL=postgresql://postgres:password@db:5432/mydb
      target: runner
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/mydb
    depends_on:
      db:
        condition: service_started
      be-db:
        condition: service_completed_successfully
    networks:
      - default
  be-db: 
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.composed
      args:
        - DATABASE_URL=postgresql://postgres:password@db:5432/mydb
      target: db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/mydb
    depends_on:
      db:
        condition: service_started
    networks:
      - default
    restart: on-failure
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - .docker/data:/var/lib/postgresql/
    networks:
      - default
networks:
  default:
    name: complete-example-network

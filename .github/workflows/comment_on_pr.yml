name: Hello David on PR
on:
    pull_request_target:
        branches: [master, main]
        types: [opened, synchronize, reopened]
permissions:
    pull-requests: write
    issues: write
jobs:
    comment:
        runs-on: ubuntu-latest
        steps:
            - name: Comment on PR
              uses: actions/github-script@v9
              with:
                  script: |
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      });

                      const hasHelloDavidComment = comments.some(comment => comment.body.includes('Hello David'));

                      if (!hasHelloDavidComment) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body: 'Hello David! Thanks for your contribution. a We will review your PR soon.'
                          });
                      }

name: Comment on PR
on:
    pull_request_target:
        types: [opened]
        branches: [master]
permissions:
    issues: write
    pull-requests: write
jobs:
    comment:
        runs-on: ubuntu-latest
        steps:
            - name: Comment hello on the pull request
              uses: actions/github-script@v9
              with:
                  script: |
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      })

                      const hasHelloComment = comments.some((comment) => comment.body?.trim() === 'Here is Johny!')

                      if (!hasHelloComment) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body: 'Here is Johny!',
                          })
                      }
